name: Launcher

on:
  push:
    branches: [ main, develop ]
    paths: [ 'launcher/**', '.github/workflows/launcher.yml' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'launcher/**', '.github/workflows/launcher.yml' ]

jobs:
  launcher-windows:
    name: Launcher - Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          path: launcher/target/release/launcher.exe
          retention-days: 7

  launcher-linux:
    name: Launcher - Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install native dependencies (rfd/GTK dialogs)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: launcher-linux
          path: launcher/target/release/launcher
          retention-days: 7
