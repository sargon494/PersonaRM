name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  BUILD_TYPE: Release
  CMAKE_BUILD_TYPE: Release
  PYTHONIOENCODING: utf-8

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Build Verification
  # ───────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build - Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --verbose

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/Release/
          retention-days: 7

  build-linux:
    name: Build - Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config Release --verbose

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/Release/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────
  # Unit Tests
  # ───────────────────────────────────────────────────────────────────────
  unit-tests-windows:
    name: Unit Tests - Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --verbose

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-unit-test-results
          path: build/Release/
          retention-days: 7

  unit-tests-linux:
    name: Unit Tests - Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --verbose

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-unit-test-results
          path: build/Release/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────
  # Integration Tests
  # ───────────────────────────────────────────────────────────────────────
  integration-tests-windows:
    name: Integration Tests - Windows
    runs-on: windows-latest
    needs: [build-windows]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: build/Release/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Make binary executable
        run: chmod +x build/Release/personarm* || true

      - name: Run integration tests
        run: python tests/integration/run_tests.py

  integration-tests-linux:
    name: Integration Tests - Linux
    runs-on: ubuntu-latest
    needs: [build-linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: build/Release/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Make binary executable
        run: chmod +x build/Release/personarm* || true

      - name: Run integration tests
        run: python tests/integration/run_tests.py

  # ───────────────────────────────────────────────────────────────────────
  # Code Quality
  # ───────────────────────────────────────────────────────────────────────
  code-quality-windows:
    name: Code Quality - Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --verbose

  code-quality-linux:
    name: Code Quality - Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config Release --verbose
