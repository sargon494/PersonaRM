name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  BUILD_TYPE: Release
  CMAKE_BUILD_TYPE: Release

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Build Verification
  # ───────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build - Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cmake ninja

      - name: Create build directory
        run: |
          mkdir build
          cd build

      - name: Configure CMake
        run: |
          cmake .. `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/vs2022.cmake `
            -G "Visual Studio 17 2022" `
            -A x64

      - name: Build
        run: |
          cmake --build build --config Release --verbose

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/Release/
          retention-days: 7

  build-linux:
    name: Build - Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cmake ninja

      - name: Create build directory
        run: |
          mkdir build
          cd build

      - name: Configure CMake
        run: |
          cmake .. `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/linux.cmake

      - name: Build
        run: |
          cmake --build build --config Release --verbose

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/Release/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────
  # Unit Tests
  # ───────────────────────────────────────────────────────────────────────
  unit-tests-windows:
    name: Unit Tests - Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cmake ninja google-test

      - name: Create build directory
        run: |
          mkdir build
          cd build

      - name: Configure CMake
        run: |
          cmake .. `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/vs2022.cmake `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DBUILD_TESTS=ON

      - name: Build
        run: |
          cmake --build build --config Release --verbose

      - name: Run unit tests
        run: |
          ctest --output-on-failure -R "unit"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-unit-test-results
          path: build/Release/
          retention-days: 7

  unit-tests-linux:
    name: Unit Tests - Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cmake ninja google-test

      - name: Create build directory
        run: |
          mkdir build
          cd build

      - name: Configure CMake
        run: |
          cmake .. `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/linux.cmake `
            -DBUILD_TESTS=ON

      - name: Build
        run: |
          cmake --build build --config Release --verbose

      - name: Run unit tests
        run: |
          ctest --output-on-failure -R "unit"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-unit-test-results
          path: build/Release/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────
  # Integration Tests
  # ───────────────────────────────────────────────────────────────────────
  integration-tests-windows:
    name: Integration Tests - Windows
    runs-on: windows-latest
    needs: [build-windows]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: build/Release/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install game dependencies
        run: |
          pip install pygame

      - name: Run integration tests
        run: |
          python tests/integration/run_tests.py

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-integration-test-results
          path: build/Release/
          retention-days: 7

  integration-tests-linux:
    name: Integration Tests - Linux
    runs-on: ubuntu-latest
    needs: [build-linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: build/Release/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install game dependencies
        run: |
          pip install pygame

      - name: Run integration tests
        run: |
          python tests/integration/run_tests.py

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-integration-test-results
          path: build/Release/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────
  # Performance Tests
  # ───────────────────────────────────────────────────────────────────────
  performance-tests-windows:
    name: Performance Tests - Windows
    runs-on: windows-latest
    needs: [build-windows]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: build/Release/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install profiling tools
        run: |
          pip install psutil

      - name: Run performance tests
        run: |
          python tests/performance/run_tests.py

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-performance-test-results
          path: build/Release/
          retention-days: 7

  performance-tests-linux:
    name: Performance Tests - Linux
    runs-on: ubuntu-latest
    needs: [build-linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: build/Release/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install profiling tools
        run: |
          pip install psutil

      - name: Run performance tests
        run: |
          python tests/performance/run_tests.py

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-performance-test-results
          path: build/Release/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────
  # Code Quality
  # ───────────────────────────────────────────────────────────────────────
  code-quality-windows:
    name: Code Quality - Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cmake ninja

      - name: Create build directory
        run: |
          mkdir build
          cd build

      - name: Configure CMake
        run: |
          cmake .. `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/vs2022.cmake `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DBUILD_TESTS=ON

      - name: Build
        run: |
          cmake --build build --config Release --verbose

      - name: Run static analysis
        run: |
          cmake --build build --target static-analysis --config Release

  code-quality-linux:
    name: Code Quality - Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cmake ninja

      - name: Create build directory
        run: |
          mkdir build
          cd build

      - name: Configure CMake
        run: |
          cmake .. `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/linux.cmake `
            -DBUILD_TESTS=ON

      - name: Build
        run: |
          cmake --build build --config Release --verbose

      - name: Run static analysis
        run: |
          cmake --build build --target static-analysis --config Release

  # ───────────────────────────────────────────────────────────────────────
  # Documentation
  # ───────────────────────────────────────────────────────────────────────
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      - name: Build documentation
        run: |
          python -m mkdocs build

      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: site/
          retention-days: 7