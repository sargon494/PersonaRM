[package]
name = "launcher"
version = "0.1.0"
edition = "2024"
description = "PersonaRM launcher: game library, settings and Play button"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
